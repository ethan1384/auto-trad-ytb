services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dubbing
      POSTGRES_PASSWORD: dubbing
      POSTGRES_DB: dubbing
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dubbing -d dubbing"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Official minio/minio was unavailable from this environment; LocalStack provides S3-compatible storage for local dev.
  s3:
    image: localstack/localstack:3
    environment:
      SERVICES: s3
      DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 15

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://dubbing:dubbing@postgres:5432/dubbing
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://s3:4566
      S3_PUBLIC_ENDPOINT_URL: http://localhost:4566
      S3_ACCESS_KEY: test
      S3_SECRET_KEY: test
      S3_BUCKET: dubbing
      PROVIDER_MODE: local
      WHISPER_MODEL: small
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3:
        condition: service_healthy
    volumes:
      - ./services/api:/app/services/api
      - ./packages/shared:/app/packages/shared
      - ./services/worker:/app/services/worker
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://dubbing:dubbing@postgres:5432/dubbing
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://s3:4566
      S3_ACCESS_KEY: test
      S3_SECRET_KEY: test
      S3_BUCKET: dubbing
      PROVIDER_MODE: local
      WHISPER_MODEL: small
      # Host Ollama (Metal). The compose service only has the 0.5B model,
      # which copies literal drafts and misses spoken formulas.
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      REWRITE_MODEL: qwen3.8:27b
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3:
        condition: service_healthy
    command: celery -A app.celery_app.celery worker --loglevel=INFO --concurrency=1
    volumes:
      - ./services/api:/app/services/api
      - ./packages/shared:/app/packages/shared
      - ./services/worker:/app/services/worker
      - hf_cache:/root/.cache
      - argos_data:/root/.local/share/argos-translate

  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_KEEP_ALIVE: 30m
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./infra/dev/ollama-start.sh:/opt/ollama-start.sh:ro
    entrypoint: ["/bin/sh", "/opt/ollama-start.sh"]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - ./packages/shared:/packages/shared

volumes:
  postgres_data:
  localstack_data:
  hf_cache:
  argos_data:
  ollama_data:
