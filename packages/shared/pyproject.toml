[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dubbing-shared"
version = "0.1.0"
description = "Shared contracts for the YouTube dubbing platform"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["dubbing_shared*"]
